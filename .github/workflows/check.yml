name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site checks
        run: python3 tools/check.py
      - name: Colour contrast
        run: python3 tools/contrast.py
      - name: Tools import cleanly
        run: |
          python3 -m py_compile tools/brand.py tools/codes.py tools/check.py tools/contrast.py tools/ledger.py tools/licence.py tools/build_visas.py
      - name: Worker parses
        run: node --check worker/src/index.js
