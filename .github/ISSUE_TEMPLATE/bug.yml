name: Something is broken
description: A page, a tool or a check behaving wrongly
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: site/index.html, tools/brand.py, make check…
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: input
    id: browser
    attributes:
      label: Browser and OS, if it is a page
